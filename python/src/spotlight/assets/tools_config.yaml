  num_keypoints: 3
  keypoint_names:
    N: neck
    Th: thorax
    Ab: abdomen tip

# Paths below are relative to the `python/` package root (i.e.
# `python/bulk_data/...`, a symlink to /mnt/datassd/spotlight/bulk_data,
# gitignored): callers must resolve them against that root, not against
# the current working directory.

# TinyLocalizationModel (coarse neck/thorax/abdomen + flip flag on raw frames).
