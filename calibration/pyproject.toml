[project]
name = "spotlight-calibration"
version = "0.1.0"
description = ""
authors = [
    {name = "Sibo Wang-Chen", email = "sibo.wang@epfl.ch"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opencv-python (>=4.11,<5.0)",
    "svgwrite (==1.4.3)",
    "numpy (>=2.0,<3.0)",
    "tqdm (>=4.67,<5.0)",
    "ipython (>=9.0,<10.0)",
    "ipykernel (>=6.29,<7.0)",
    "matplotlib (>=3.10,<4.0)"
]

[tool.poetry]
packages = [{include = "calibration", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
