[project]
name = "spotlight-tools"
version = "0.1.0"
description = ""
authors = [
    {name = "Sibo Wang-Chen", email = "sibo.wang@epfl.ch"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "opencv-python (>=4.11,<5.0)",
    "svgwrite (==1.4.3)",
    "numpy (>=2.0,<3.0)",
    "tqdm (>=4.67,<5.0)",
    "ipython (>=9.0,<10.0)",
    "ipykernel (>=6.29,<7.0)",
    "matplotlib (>=3.10,<4.0)",
    "joblib (>=1.4,<2.0)",
    "pandas (>=2.2,<3.0)",
    "scipy (>=1.15,<2.0)",
    "pytest (>=8.3,<9.0)",
    "scikit-learn (>=1.6,<2.0)",
    "seaborn (==0.13.2)",
    "ipywidgets (>=8.1,<9.0)",
    "pyyaml (>=6.0,<7.0)",
    "tyro (==0.9.17)",
    "vidgear (==0.3.3)",
    "setuptools (>=78,<79)"  # needed for vidgear
]

[tool.poetry]
packages = [{include = "spotlight_tools", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
