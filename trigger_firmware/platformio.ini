[env:arduino_nano_esp32]
; The espressif32 6.x line bundles arduino-esp32 3.x, which the Arduino Nano
; ESP32 board requires. Pinning here keeps the framework on the proven 3.0/3.1
; series (do not bump to 7.x without re-checking the default C++ standard).
platform = espressif32 @ ^6.13.0
board = arduino_nano_esp32
framework = arduino

; Explicitly specify C++20 (gnu++2a) and unset any older flags
build_unflags =
    -std=gnu++11
    -std=gnu++14
    -std=gnu++17
build_flags =
    -std=gnu++2a

; Library dependencies. comm_protocol is the shared serial-protocol library in
; this repo; symlink:// keeps it editable in place (no copy into .pio/libdeps),
; and it pulls in ArduinoJson transitively via its library.json. AUnit is the
; on-device unit-test framework used by test/ (see below).
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    bblanchon/ArduinoJson@^7
    symlink://../comm_protocol
    bxparks/AUnit@^1.7.1

; On-device unit tests live under test/ and run with `pio test`. They use AUnit
; (not PlatformIO's built-in Unity), so the test framework is "custom": each
; test program brings its own setup()/loop() that drives aunit::TestRunner and
; prints the results over serial.
test_framework = custom
; Build the firmware sources in src/ into the test programs so tests can link
; against the real classes (e.g. DeviceIO). src/main.cc guards its setup()/
; loop() behind #ifndef PIO_UNIT_TESTING so it does not clash with a test's own.
test_build_src = yes